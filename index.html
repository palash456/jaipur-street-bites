<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Discover and order Jaipur street food — kachori, chaat, lassi and local favourites." />
    <title>Jaipur Street Bites — Local food discovery & ordering</title>
    <link rel="preconnect" href="https://commons.wikimedia.org" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/chatorey-theme.css?v=19" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages.css" />
    <link rel="stylesheet" href="css/community.css?v=8" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <div id="loading-overlay" class="loading-overlay" aria-hidden="true">
        <div class="spinner"></div>
        <p class="loading-text">Loading...</p>
      </div>

      <select id="location-select" class="visually-hidden" tabindex="-1" aria-hidden="true"></select>

      <div class="app-shell-frame">
        <header id="app-header" class="app-header-slot" aria-live="polite"></header>
        <main id="app-main"></main>

        <div id="sticky-cart" class="sticky-cart">
          <div>
            <strong>Your cart</strong>
            <span id="sticky-cart-total"></span>
          </div>
          <button type="button" id="sticky-cart-btn" class="btn btn-primary">View cart</button>
        </div>

        <nav class="bottom-nav" aria-label="Main">
        <a href="#/" data-nav="home">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
          <span>Home</span>
        </a>
        <a href="#/search" data-nav="search">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>Community</span>
        </a>
        <a href="#/add-stall" class="nav-add nav-add--stall" data-nav="add">
          <span class="fab fab--stall"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg></span>
          <span>Add stall</span>
        </a>
        <a href="#/orders" data-nav="orders">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>
          <span>Orders</span>
        </a>
        <a href="#/profile" data-nav="profile">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>
          <span>Profile</span>
        </a>
        </nav>
      </div>

      <div id="modal-backdrop" class="modal-backdrop">
        <div id="modal-root" class="modal" role="dialog"></div>
      </div>
      <div id="toast" class="toast" role="status"></div>
    </div>

    <script type="module" src="js/app.js?v=19"></script>
  </body>
</html>
